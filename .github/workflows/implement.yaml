# Implementation agent (Sonnet).
# - Issue labeled `ready`: implements it on branch `agent/issue-<n>` and opens a pull request
#   labeled `agent-pr`.
# - Agent pull request labeled `review:changes` (set by agent-review.yaml): addresses the
#   latest agent review and pushes to the same branch.
# - The repository owner submits a "changes requested" review on an agent pull request:
#   addresses that review (it takes precedence over agent reviews) and pushes. The label
#   `review:owner` keeps the Opus review out; agent-review.yaml requests the owner's review once
#   the build passes and sends a failed build back here first. This mode is not a review round
#   and leaves the `review-round-*` labels alone.
# - On pull requests whose branch is behind main the agent rebases it onto main (resolving
#   conflicts) and the workflow force-pushes with lease. A ruleset allows force pushes only on
#   `agent/**` branches.
# - Started manually or by agent-sync.yaml with a pull request number (GitHub does not run
#   pull_request and pull_request_review workflows while a pull request has merge conflicts):
#   with `review`, addresses that "changes requested" review of the owner unless it is already
#   outdated; on a pull request labeled `review:changes`, addresses the latest agent review;
#   otherwise only brings the branch up to date with main (mode `rebase`). A rebase without
#   conflicts is done by a script and keeps an approval (`agent-review` status); only conflicts
#   start the agent. Resolved conflicts of an approved pull request are reviewed again
#   (label `review:rebase`, not a new review round).
# Runs as the GitHub App from AGENT_APP_ID so that its pushes and pull requests trigger
# Build and Agent Review.
name: Agent Implement

on:
  issues:
    # Also fires for issues created with the label, so `opened` is not needed.
    types: [labeled]
  pull_request:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement (leave empty when a pull request is given)
        required: false
      pr:
        description: Agent pull request to update (rebase, or address the review given below)
        required: false
      review:
        description: ID of the owner's "changes requested" review to address (needs pr)
        required: false

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: agent-implement-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ready') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'review:changes' &&
        contains(github.event.pull_request.labels.*.name, 'agent-pr')) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' &&
        github.event.review.user.login == github.repository_owner &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'agent-pr')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Determine task
        id: ctx
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_ID: ${{ github.event.review.id || inputs.review }}
        run: |
          skip() { echo "$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$PR_NUMBER" ]; then
            # Started for a pull request whose events GitHub may have dropped (merge conflicts).
            info=$(gh pr view "$PR_NUMBER" --json state,headRefName,headRefOid,labels,isCrossRepository)
            labels=$(echo "$info" | jq -r '.labels[].name')
            PR_BRANCH=$(echo "$info" | jq -r .headRefName)
            head=$(echo "$info" | jq -r .headRefOid)
            [ "$(echo "$info" | jq -r .state)" = "OPEN" ] || skip "#$PR_NUMBER is not open"
            [ "$(echo "$info" | jq -r .isCrossRepository)" = "false" ] || skip "#$PR_NUMBER comes from a fork"
            echo "$labels" | grep -qx agent-pr || skip "#$PR_NUMBER is not an agent pull request"
            case "$PR_BRANCH" in agent/*) ;; *) skip "Only agent/** branches may be force-pushed" ;; esac
            echo "$labels" | grep -qx agent-blocked && skip "#$PR_NUMBER is blocked and waits for a human"
            if [ -n "$REVIEW_ID" ]; then
              review=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID" --jq '"\(.user.login) \(.state) \(.commit_id)"')
              # Outdated once the agent pushed after it (e.g. the review event did start a run).
              [ "$review" = "$OWNER CHANGES_REQUESTED $head" ] || skip "Review $REVIEW_ID is not an open change request of the owner"
              EVENT=pull_request_review
            elif echo "$labels" | grep -qx 'review:changes'; then
              EVENT=pull_request
            else
              mode=rebase
            fi
          fi

          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_review" ] || [ "$mode" = "rebase" ]; then
            if [ "$mode" = "rebase" ]; then
              :
            elif [ "$EVENT" = "pull_request" ]; then
              mode=pr
              gh pr edit "$PR_NUMBER" --remove-label "review:changes"
            else
              mode=owner-review
              # The owner reviews the result directly; keep agent-review.yaml out of it.
              gh label create review:owner --color 1D76DB --description "Owner reviews; no agent review" --force
              gh pr edit "$PR_NUMBER" --add-label review:owner
              echo "review=$REVIEW_ID" >> "$GITHUB_OUTPUT"
            fi
            issue=$(gh pr view "$PR_NUMBER" --json body --jq .body | grep -oiE '(closes|fixes|resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            # The latest Build of the head commit, so that the agent can read a failure's log
            # (owner reviews often just point at a red build).
            head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
            build=$(gh run list --workflow Build --commit "$head" --event pull_request --limit 1 \
              --json databaseId,status,conclusion --jq '.[0] // empty | "\(.databaseId) \(if (.conclusion // "") == "" then .status else .conclusion end)"')
            {
              echo "mode=$mode"
              echo "pr=$PR_NUMBER"
              echo "issue=$issue"
              echo "branch=$PR_BRANCH"
              echo "build_run=${build%% *}"
              echo "build_result=${build#* }"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [ -n "$ISSUE_NUMBER" ] || skip "Neither an issue nor a pull request was given"
          branch="agent/issue-$ISSUE_NUMBER"
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already exists for issue #$ISSUE_NUMBER"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --body "🤖 The implementation agent started working on this issue ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
          {
            echo "mode=issue"
            echo "issue=$ISSUE_NUMBER"
            echo "branch=$branch"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - if: steps.ctx.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.mode != 'issue' && steps.ctx.outputs.branch || 'main' }}
          token: ${{ steps.app.outputs.token }}
          # Full history, so that the agent can rebase onto origin/main.
          fetch-depth: 0

      - if: steps.ctx.outputs.skip == 'false'
        name: Prepare branch
        id: git
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          MODE: ${{ steps.ctx.outputs.mode }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          bot_id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${bot_id}+${SLUG}[bot]@users.noreply.github.com"
          if [ "$MODE" = "issue" ]; then
            git switch -c "$BRANCH"
          fi
          # Merging requires an up-to-date branch, so the agent rebases pull requests behind main.
          main=current
          if ! git merge-base --is-ancestor origin/main HEAD; then
            main=behind
            git merge-tree --write-tree origin/main HEAD > /dev/null || main=conflicts
          fi
          before=$(git rev-parse HEAD)
          agent=true
          if [ "$MODE" = "rebase" ]; then
            if [ "$main" = "current" ]; then
              echo "The branch is already up to date with main"
              echo "noop=true" >> "$GITHUB_OUTPUT"
            elif [ "$main" = "behind" ]; then
              # No conflicts with main: rebase without the agent. Single commits may still
              # conflict while they are replayed; then the agent resolves them.
              if git rebase origin/main; then
                agent=false
              else
                git rebase --abort
                main=conflicts
              fi
            fi
          fi
          {
            echo "main=$main"
            echo "before=$before"
            echo "agent=$agent"
          } >> "$GITHUB_OUTPUT"

      - if: steps.ctx.outputs.skip == 'false' && steps.git.outputs.noop != 'true' && steps.git.outputs.agent == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: steps.ctx.outputs.skip == 'false' && steps.git.outputs.noop != 'true' && steps.git.outputs.agent == 'true'
        run: npm ci

      - if: steps.ctx.outputs.skip == 'false' && steps.git.outputs.noop != 'true' && steps.git.outputs.agent == 'true'
        id: claude
        # Pinned: new action versions have changed permission defaults without notice.
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # `git rebase --continue` must not wait for an editor.
          GIT_EDITOR: "true"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "*"
          # The pull requests are authored by the agent's GitHub App, whose write access the action
          # cannot confirm, so by default it denies every command that runs code from the checkout
          # (lint, build, tests). Only branches of this repository get here: the review trigger
          # checks head.repo, dispatches reject forks, and labels need write access.
          restrict_untrusted_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            You are the implementation agent for Solar Punk City. Follow CLAUDE.md.

            ${{ steps.ctx.outputs.mode == 'issue' && format('TASK: Implement issue #{0}. Read it with `gh issue view {0} --comments`.', steps.ctx.outputs.issue) || '' }}${{ steps.ctx.outputs.mode == 'pr' && format('TASK: Pull request #{0} (issue #{1}) received change requests from the review agent. Read the issue with `gh issue view {1}` and the pull request with `gh pr view {0} --comments`; the latest comment starting with `<!-- agent-review` is the review to address. If it reports a failed build, inspect the run with `gh run view <run-id> --log-failed`. Address every valid point; if you disagree with a point, explain why in the commit body.', steps.ctx.outputs.pr, steps.ctx.outputs.issue) || '' }}${{ steps.ctx.outputs.mode == 'owner-review' && format('TASK: The repository owner requested changes on pull request #{0} (issue #{1}). Read the issue with `gh issue view {1}` and the pull request with `gh pr view {0} --comments`. Read the owner''s review with exactly `gh api repos/{2}/pulls/{0}/reviews/{3}` and its inline comments (see `path`, `line` and `body`) with exactly `gh api --paginate repos/{2}/pulls/{0}/reviews/{3}/comments`. Where the owner''s review conflicts with earlier agent reviews (comments starting with `<!-- agent-review`), the owner''s review wins. Address every point of the owner''s review; if you disagree with a point, explain why in the commit body instead of skipping it silently.', steps.ctx.outputs.pr, steps.ctx.outputs.issue, github.repository, steps.ctx.outputs.review) || '' }}${{ steps.ctx.outputs.mode == 'rebase' && format('TASK: Pull request #{0} (issue #{1}) conflicts with main. Your only task is the rebase described below; read the issue with `gh issue view {1}` and the pull request with `gh pr view {0}` to understand its intent. Do not change anything beyond what resolving the conflicts and keeping lint, build and tests green requires, and make no commit of your own unless that is needed for main''s changes to work with this pull request.', steps.ctx.outputs.pr, steps.ctx.outputs.issue) || '' }}

            ${{ steps.ctx.outputs.mode != 'issue' && steps.ctx.outputs.build_run != '' && format('BUILD: The latest Build of the pull request''s head commit is run {0} ({1}).{2}', steps.ctx.outputs.build_run, steps.ctx.outputs.build_result, steps.ctx.outputs.build_result == 'failure' && ' It failed; whatever else the task says, the pull request must end with a passing build. Read the failures with exactly `gh run view <run-id> --log-failed` (the run ID above), reproduce them locally and fix them.' || '') || '' }}

            ${{ steps.ctx.outputs.mode != 'issue' && steps.git.outputs.main != 'current' && format('FIRST: The branch is behind main{0}. Before anything else, rebase it with exactly `git rebase --autostash origin/main`. Resolve each conflict so that the changes of both sides are kept (main''s changes are already reviewed; adapt this pull request to them), stage the resolved files with `git add <path>...` and run exactly `git rebase --continue` until the rebase is done. If a conflict cannot be resolved sensibly, run exactly `git rebase --abort`, do not commit and write the conflicting files and the reason to `agent-blocked.md`. The rebase does not count as your one commit; if the task asks for nothing beyond the rebase, no further commit is needed.', steps.git.outputs.main == 'conflicts' && ' and conflicts with it' || '') || '' }}

            Rules:
            - The working tree is already on the right branch. Do not switch branches and do not push;
              the workflow pushes and opens the pull request.
            - Implement exactly the acceptance criteria with a minimal diff. Do not change `.github/`
              or `.claude/`; the workflow rejects such commits.${{ steps.ctx.outputs.mode != 'issue' && ' This is a pull request, so `CLAUDE.md` and `.claude/` have been reset to their state on main and may show up as modified: leave them alone and do not change `CLAUDE.md` either.' || '' }}
              If the task needs a change there, implement everything else and describe the exact
              change for a human in the commit body.
            - Read files only with `Read`, `Glob` and `Grep`, and change them only with `Edit` and
              `Write`, never with shell commands (`cat`, `sed`, `python3`, heredocs, `cd`): they are not
              allowed and will be denied. To run single tests use `npx vitest run <file>`, to format
              use `npx prettier --write <path>...`. Run e2e tests only through the npm script, e.g.
              `npm run test:e2e -- e2e/smoke.spec.ts -g "<name>"`; `npx playwright` is denied, and so
              is piping into other commands (`| head`, `| grep`). A partial e2e run fails the coverage
              thresholds; only the full `npm run test:e2e` has to pass them.
            - Add or update dependencies only with `npm install`, never by editing `package-lock.json`.
            - Run `npm run lint`, `npm run build` and `npm test` (if the project has a `test` script)
              and fix all failures before committing.
            - Make exactly ONE commit. Stage only the files you changed (`git add <path>...`), never
              `git add -A` or `git add .`. Subject: Conventional Commits.
              Body: what changed and why, and how each acceptance criterion (or review point) is met.
              The body becomes the pull request description.
            - If the task is unclear, contradictory or not implementable, do not commit. Instead write
              the reason and your open questions to `agent-blocked.md` in the repository root.
            - Never stop without either exactly one commit or an `agent-blocked.md`. If a tool call is
              denied and you cannot reach the goal with the allowed tools, write the denied command
              and what you needed it for to `agent-blocked.md`.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 400
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm ci),Bash(npm install:*),Bash(npx playwright install:*),Bash(npm test),Bash(npm run test:e2e:*),Bash(npx vitest:*),Bash(npm run lint),Bash(npm run prettier),Bash(npx prettier:*),Bash(npm run build),Bash(npx tsc:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rebase --autostash origin/main),Bash(git rebase --continue),Bash(git rebase --abort),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*)${{ steps.ctx.outputs.mode == 'owner-review' && format(',Bash(gh api repos/{0}/pulls/{1}/reviews/{2}),Bash(gh api --paginate repos/{0}/pulls/{1}/reviews/{2}/comments)', github.repository, steps.ctx.outputs.pr, steps.ctx.outputs.review) || '' }}"

      - if: steps.ctx.outputs.skip == 'false' && steps.git.outputs.noop != 'true'
        name: Push and open pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          MODE: ${{ steps.ctx.outputs.mode }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          PR: ${{ steps.ctx.outputs.pr }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          BEFORE: ${{ steps.git.outputs.before }}
          AGENT: ${{ steps.git.outputs.agent }}
          STATUS_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          target=$([ "$MODE" = "issue" ] && echo "$ISSUE" || echo "$PR")

          if [ -d "$(git rev-parse --git-path rebase-merge)" ]; then
            git rebase --abort
            echo "The agent left an unfinished rebase onto main, so nothing was pushed." > agent-blocked.md
          fi

          # The prompt forbids changes to workflows and agent configuration; enforce it before
          # anything is pushed. On pull requests claude-code-action resets .claude/ and CLAUDE.md
          # to main and copies the PR's version to .claude-pr/, so committing them reverts the PR.
          # A rebase brings in main's changes to these files, so compare what the branch changes
          # relative to main before and after the agent ran, file by file.
          pattern='^(\.github/|\.claude/|\.claude-pr/)'
          [ "$MODE" = "issue" ] || pattern='^(\.github/|\.claude/|\.claude-pr/|CLAUDE\.md$|CLAUDE\.local\.md$)'
          base_before=$(git merge-base origin/main "$BEFORE")
          base_after=$(git merge-base origin/main HEAD)
          protected=$(
            { git diff --name-only "$base_before" "$BEFORE"; git diff --name-only "$base_after" HEAD; } |
              grep -E "$pattern" | sort -u | while read -r file; do
                [ "$(git diff "$base_before" "$BEFORE" -- "$file" | git patch-id --stable)" = \
                  "$(git diff "$base_after" HEAD -- "$file" | git patch-id --stable)" ] || echo "$file"
              done
          )
          if [ -n "$protected" ]; then
            {
              echo "The agent changed protected files, which is not allowed, so nothing was pushed:"
              echo
              echo "$protected" | sed 's/^/- `/; s/$/`/'
            } > agent-blocked.md
            git reset --hard -q "$BEFORE"
          fi

          if [ -f agent-blocked.md ] || [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            git reset --hard -q "$BEFORE"
            reason=$(cat agent-blocked.md 2>/dev/null || echo "The agent made no changes.")
            # Name the tool calls that were denied, so that missing permissions are easy to spot.
            denied=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]?] | .[]
              | "- `\(.tool_name)`: `\((.tool_input.command // .tool_input.file_path // "") | .[0:200])`"' \
              "$EXECUTION_FILE" 2>/dev/null || true)
            if [ -n "$denied" ]; then
              reason=$(printf '%s\n\nDenied tool calls:\n\n%s' "$reason" "$denied")
            fi
            gh label create agent-blocked --color B60205 --description "Agent needs a human" --force
            # issues API works for both issues and pull requests
            gh api "repos/$GH_REPO/issues/$target/labels" -f "labels[]=agent-blocked" > /dev/null
            printf '🤖 **Implementation agent blocked** ([run](%s))\n\n%s\n\n@%s please take it from here.\n' \
              "$run_url" "$reason" "$OWNER" > "$RUNNER_TEMP/blocked.md"
            gh api "repos/$GH_REPO/issues/$target/comments" -F "body=@$RUNNER_TEMP/blocked.md" > /dev/null
            exit 0
          fi

          if git merge-base --is-ancestor "$BEFORE" HEAD; then
            git push origin "HEAD:$BRANCH"
          else
            # Rebased onto main: replace the branch, unless someone pushed to it in the meantime.
            git push --force-with-lease="$BRANCH:$BEFORE" origin "HEAD:$BRANCH"
          fi

          # The agent's new commits, without main's commits and old ones rebased without conflicts.
          git log --format='- %s' --cherry-pick --right-only "$BEFORE...HEAD" ^origin/main > "$RUNNER_TEMP/commits.md"
          git merge-base --is-ancestor "$BEFORE" HEAD || echo "- Rebased onto main" >> "$RUNNER_TEMP/commits.md"

          if [ "$MODE" = "rebase" ]; then
            new_head=$(git rev-parse HEAD)
            if [ "$AGENT" = "false" ]; then
              # Nothing but main's changes was added, so an approval stays valid. Build still runs.
              # agent-review-gate.yaml keeps a success it finds on the new commit.
              approval=$(GH_TOKEN="$STATUS_TOKEN" gh api "repos/$GH_REPO/commits/$BEFORE/status" \
                --jq '[.statuses[] | select(.context == "agent-review")][0] | select(.state == "success") | .description')
              if [ -n "$approval" ]; then
                GH_TOKEN="$STATUS_TOKEN" gh api "repos/$GH_REPO/statuses/$new_head" -f state=success \
                  -f context=agent-review -f description="Rebased onto main without conflicts; ${approval:0:80}" \
                  -f target_url="$run_url" > /dev/null
              fi
              printf '🤖 Rebased onto main without conflicts ([run](%s)).\n' "$run_url" | gh pr comment "$PR" --body-file -
              exit 0
            fi
            labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
            if echo "$labels" | grep -qx 'review:approved'; then
              # Resolving conflicts changes code: the review agent checks it again after Build,
              # without starting a new review round.
              gh label create review:rebase --color C2E0C6 --description "Review agent checks a conflict resolution" --force
              gh pr edit "$PR" --remove-label review:approved --add-label review:rebase
              note="The review agent checks the conflict resolution after the build."
            elif echo "$labels" | grep -qxE 'review:owner|review:max-rounds'; then
              # agent-review.yaml asks the owner once the build passes.
              gh label create review:owner --color 1D76DB --description "Owner reviews; no agent review" --force
              gh pr edit "$PR" --add-label review:owner
              note="@$OWNER is asked to review again once the build passes."
            else
              note="The review continues as usual after the build."
            fi
            printf '🤖 Resolved the conflicts with main ([run](%s)):\n\n%s\n\n%s\n' \
              "$run_url" "$(cat "$RUNNER_TEMP/commits.md")" "$note" | gh pr comment "$PR" --body-file -
            exit 0
          fi

          if [ "$MODE" = "owner-review" ]; then
            # Back to the owner without another agent review (review:owner stays set);
            # agent-review.yaml requests the owner's review once the build passes.
            if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx agent-blocked; then
              gh pr edit "$PR" --remove-label agent-blocked
            fi
            printf '🤖 Addressed the review by @%s ([run](%s)):\n\n%s\n\nYou are asked to review again once the build passes.\n' \
              "$OWNER" "$run_url" "$(cat "$RUNNER_TEMP/commits.md")" | gh pr comment "$PR" --body-file -
            exit 0
          fi

          if [ "$MODE" = "pr" ]; then
            printf '🤖 Addressed the review comments ([run](%s)):\n\n%s\n' \
              "$run_url" "$(cat "$RUNNER_TEMP/commits.md")" | gh pr comment "$PR" --body-file -
            exit 0
          fi

          title=$(git log -1 --format=%s)
          {
            git log --format=%b "$BEFORE..HEAD"
            printf '\nCloses #%s\n\n🤖 Generated by the implementation agent with [Claude Code](https://claude.com/claude-code) ([run](%s))\n' "$ISSUE" "$run_url"
          } > "$RUNNER_TEMP/body.md"
          gh label create agent-pr --color 5319E7 --description "Pull request by the implementation agent" --force
          gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md" --label agent-pr
